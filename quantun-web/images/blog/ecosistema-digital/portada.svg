<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e0c"/>
      <stop offset="100%" stop-color="#1a1a16"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Red de nodos (ecosistema) -->
  <g stroke="#c8f04e" stroke-opacity="0.25" fill="none">
    <circle cx="900" cy="200" r="8" fill="#c8f04e" fill-opacity="0.4" stroke="none"/>
    <circle cx="1020" cy="300" r="6" fill="#c8f04e" fill-opacity="0.3" stroke="none"/>
    <circle cx="860" cy="360" r="10" fill="#c8f04e" fill-opacity="0.5" stroke="none"/>
    <circle cx="980" cy="430" r="7" fill="#c8f04e" fill-opacity="0.3" stroke="none"/>
    <circle cx="1080" cy="200" r="5" fill="#c8f04e" fill-opacity="0.2" stroke="none"/>
    <circle cx="940" cy="480" r="6" fill="#c8f04e" fill-opacity="0.25" stroke="none"/>
    <line x1="900" y1="200" x2="1020" y2="300" stroke-width="1.5"/>
    <line x1="900" y1="200" x2="1080" y2="200" stroke-width="1"/>
    <line x1="1020" y1="300" x2="860" y2="360" stroke-width="1.5"/>
    <line x1="860" y1="360" x2="980" y2="430" stroke-width="1"/>
    <line x1="1080" y1="200" x2="1020" y2="300" stroke-width="1"/>
    <line x1="980" y1="430" x2="940" y2="480" stroke-width="1"/>
    <line x1="860" y1="360" x2="940" y2="480" stroke-width="1"/>
  </g>

  <!-- Círculos orbitales -->
  <circle cx="960" cy="340" r="180" fill="none" stroke="#c8f04e" stroke-width="0.8" stroke-opacity="0.1" stroke-dasharray="6 4"/>
  <circle cx="960" cy="340" r="260" fill="none" stroke="#c8f04e" stroke-width="0.6" stroke-opacity="0.07" stroke-dasharray="4 6"/>

  <!-- Brackets -->
  <path d="M60,60 L60,40 L80,40" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M1140,60 L1140,40 L1120,40" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M60,690 L60,710 L80,710" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M1140,690 L1140,710 L1120,710" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Categoría -->
  <rect x="80" y="220" width="190" height="34" rx="17" fill="#c8f04e" fill-opacity="0.15" stroke="#c8f04e" stroke-width="1" stroke-opacity="0.5"/>
  <text x="175" y="242" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#c8f04e" text-anchor="middle" letter-spacing="1.5">ESTRATEGIA DIGITAL</text>

  <!-- Título -->
  <text x="80" y="318" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-2">Ecosistema</text>
  <text x="80" y="386" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-2">digital para tu</text>
  <text x="80" y="454" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#c8f04e" letter-spacing="-2">empresa</text>

  <rect x="80" y="478" width="60" height="3" rx="2" fill="#c8f04e"/>
  <text x="80" y="530" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.4">Albert Anaya · 7 min de lectura · May 2026</text>
  <text x="1120" y="710" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" fill-opacity="0.5" text-anchor="end" letter-spacing="1">QUANTUN<tspan fill="#c8f04e">.</tspan></text>
</svg>
