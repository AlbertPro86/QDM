<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a08"/>
      <stop offset="100%" stop-color="#161612"/>
    </linearGradient>
    <linearGradient id="hexGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8f04e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c8f04e" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Grid hexagonal decorativo -->
  <g transform="translate(720, 80)" stroke="#c8f04e" stroke-opacity="0.15" fill="none" stroke-width="1">
    <!-- Fila 1 -->
    <polygon points="80,0 120,23 120,69 80,92 40,69 40,23"/>
    <polygon points="200,0 240,23 240,69 200,92 160,69 160,23"/>
    <polygon points="320,0 360,23 360,69 320,92 280,69 280,23"/>
    <!-- Fila 2 -->
    <polygon points="140,69 180,92 180,138 140,161 100,138 100,92"/>
    <polygon points="260,69 300,92 300,138 260,161 220,138 220,92"/>
    <!-- Fila 3 -->
    <polygon points="80,138 120,161 120,207 80,230 40,207 40,161"/>
    <polygon points="200,138 240,161 240,207 200,230 160,207 160,161"/>
    <polygon points="320,138 360,161 360,207 320,230 280,207 280,161"/>
    <!-- Destacado central con fill -->
    <polygon points="200,138 240,161 240,207 200,230 160,207 160,161" fill="url(#hexGlow)" stroke="#c8f04e" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>

  <!-- Símbolo IA central -->
  <g transform="translate(920, 310)">
    <circle cx="80" cy="80" r="50" fill="none" stroke="#c8f04e" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="80" cy="80" r="32" fill="#c8f04e" fill-opacity="0.12" stroke="#c8f04e" stroke-width="1" stroke-opacity="0.6"/>
    <text x="80" y="90" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#c8f04e" fill-opacity="0.8" text-anchor="middle">AI</text>
    <!-- Líneas radiantes -->
    <line x1="80" y1="28" x2="80" y2="14" stroke="#c8f04e" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="80" y1="132" x2="80" y2="146" stroke="#c8f04e" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="28" y1="80" x2="14" y2="80" stroke="#c8f04e" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="132" y1="80" x2="146" y2="80" stroke="#c8f04e" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="44" y1="44" x2="34" y2="34" stroke="#c8f04e" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="116" y1="116" x2="126" y2="126" stroke="#c8f04e" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="116" y1="44" x2="126" y2="34" stroke="#c8f04e" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="44" y1="116" x2="34" y2="126" stroke="#c8f04e" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- Brackets -->
  <path d="M60,60 L60,40 L80,40" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M1140,60 L1140,40 L1120,40" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M60,690 L60,710 L80,710" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M1140,690 L1140,710 L1120,710" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Categoría -->
  <rect x="80" y="220" width="140" height="34" rx="17" fill="#c8f04e" fill-opacity="0.15" stroke="#c8f04e" stroke-width="1" stroke-opacity="0.5"/>
  <text x="150" y="242" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#c8f04e" text-anchor="middle" letter-spacing="1.5">TECNOLOGÍA</text>

  <!-- Título -->
  <text x="80" y="318" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-2">Inteligencia</text>
  <text x="80" y="386" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#c8f04e" letter-spacing="-2">Artificial</text>
  <text x="80" y="454" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-2">para tu negocio</text>

  <rect x="80" y="478" width="60" height="3" rx="2" fill="#c8f04e"/>
  <text x="80" y="530" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.4">Albert Anaya · 9 min de lectura · Jun 2026</text>
  <text x="1120" y="710" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" fill-opacity="0.5" text-anchor="end" letter-spacing="1">QUANTUN<tspan fill="#c8f04e">.</tspan></text>
</svg>
