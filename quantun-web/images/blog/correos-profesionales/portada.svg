<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e0c"/>
      <stop offset="100%" stop-color="#1c1c18"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8f04e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c8f04e" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Forma decorativa -->
  <circle cx="980" cy="140" r="320" fill="url(#glow)"/>
  <circle cx="980" cy="140" r="200" fill="none" stroke="#c8f04e" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="980" cy="140" r="120" fill="none" stroke="#c8f04e" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Icono sobre (envelope) -->
  <g transform="translate(860, 300)">
    <rect x="0" y="0" width="160" height="110" rx="10" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.6"/>
    <polyline points="0,0 80,60 160,0" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="0" y1="110" x2="55" y2="55" stroke="#c8f04e" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="160" y1="110" x2="105" y2="55" stroke="#c8f04e" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- Líneas de grid decorativas -->
  <line x1="0" y1="700" x2="1200" y2="700" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
  <line x1="0" y1="650" x2="1200" y2="650" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>

  <!-- Bracket esquina -->
  <path d="M60,60 L60,40 L80,40" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M1140,60 L1140,40 L1120,40" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M60,690 L60,710 L80,710" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M1140,690 L1140,710 L1120,710" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Categoría chip -->
  <rect x="80" y="220" width="190" height="34" rx="17" fill="#c8f04e" fill-opacity="0.15" stroke="#c8f04e" stroke-width="1" stroke-opacity="0.5"/>
  <text x="175" y="242" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#c8f04e" text-anchor="middle" letter-spacing="1.5">ESTRATEGIA DIGITAL</text>

  <!-- Título -->
  <text x="80" y="318" font-family="Inter, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-2">Correos</text>
  <text x="80" y="390" font-family="Inter, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-2">profesionales</text>

  <!-- Subtítulo -->
  <text x="80" y="446" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#ffffff" fill-opacity="0.55">La primera impresión que genera confianza</text>

  <!-- Línea acento -->
  <rect x="80" y="478" width="60" height="3" rx="2" fill="#c8f04e"/>

  <!-- Meta -->
  <text x="80" y="530" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.4">Albert Anaya · 5 min de lectura · May 2026</text>

  <!-- Logo QUANTUN -->
  <text x="1120" y="710" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" fill-opacity="0.5" text-anchor="end" letter-spacing="1">QUANTUN<tspan fill="#c8f04e">.</tspan></text>
</svg>
