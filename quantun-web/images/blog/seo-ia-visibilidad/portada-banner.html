<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>SEO en la era de la IA — QUANTUN Digital</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 750px; overflow: hidden; background: #1a1a18; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .banner { position: relative; width: 1200px; height: 750px; background: #1a1a18; overflow: hidden; }
  .bg-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Horizontal bands */
  .band-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: #c8f04e;
  }

  /* Large editorial number */
  .editorial-num {
    position: absolute;
    right: 56px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 320px;
    font-weight: 900;
    color: rgba(200,240,78,0.05);
    line-height: 1;
    letter-spacing: -0.06em;
    user-select: none;
    pointer-events: none;
  }

  .content {
    position: absolute;
    top: 0; left: 0;
    width: 700px; height: 750px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 80px;
  }

  .category {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .cat-pill {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #0e0e0c;
    background: #c8f04e;
    padding: 5px 14px;
    border-radius: 1px;
  }
  .cat-sep {
    width: 1px; height: 18px;
    background: rgba(255,255,255,0.15);
  }
  .cat-secondary {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }

  .title {
    font-size: 80px;
    font-weight: 900;
    line-height: 0.96;
    letter-spacing: -0.03em;
    color: #ffffff;
    margin-bottom: 12px;
  }

  .title-sub {
    font-size: 80px;
    font-weight: 300;
    line-height: 0.96;
    letter-spacing: -0.03em;
    color: rgba(255,255,255,0.3);
    margin-bottom: 36px;
  }
  .title-sub span {
    color: #c8f04e;
    font-weight: 700;
  }

  .desc-row {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .desc-bar {
    width: 3px;
    height: 60px;
    background: linear-gradient(180deg, #c8f04e, transparent);
    flex-shrink: 0;
    margin-top: 2px;
  }
  .desc {
    font-size: 15px;
    color: rgba(255,255,255,0.42);
    line-height: 1.7;
    max-width: 440px;
    font-weight: 400;
  }

  .logo {
    position: absolute;
    bottom: 52px;
    right: 64px;
    text-align: right;
  }
  .logo-wordmark {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: #ffffff;
    text-transform: uppercase;
  }
  .logo-wordmark em { color: #c8f04e; font-style: normal; }
  .logo-sub {
    font-size: 9.5px;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    margin-top: 3px;
  }

  /* SEO rank positions right side */
  .rank-visual {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-46%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 2;
  }
  .rank-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .rank-pos {
    width: 28px;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.25);
    text-align: right;
    letter-spacing: 0.05em;
  }
  .rank-pos.top { color: #c8f04e; }
  .rank-bar-wrap {
    width: 160px;
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 1px;
    overflow: hidden;
  }
  .rank-bar-fill {
    height: 100%;
    background: rgba(200,240,78,0.3);
    border-radius: 1px;
  }
  .rank-bar-fill.top {
    background: #c8f04e;
    box-shadow: 0 0 8px rgba(200,240,78,0.6);
  }
  .rank-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    flex-shrink: 0;
  }
  .rank-dot.top { background: #c8f04e; }
</style>
</head>
<body>
<div class="banner">

  <div class="band-top"></div>

  <svg class="bg-svg" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
    <!-- Search bar wireframe - top area right -->
    <g transform="translate(700, 80)" opacity="0.25">
      <rect x="0" y="0" width="400" height="44" rx="4" fill="none" stroke="rgba(200,240,78,0.4)" stroke-width="1.2"/>
      <!-- Magnifier icon -->
      <circle cx="24" cy="22" r="8" fill="none" stroke="#c8f04e" stroke-width="1.5"/>
      <line x1="30" y1="28" x2="38" y2="36" stroke="#c8f04e" stroke-width="1.5"/>
      <!-- Text placeholder lines -->
      <rect x="52" y="18" width="140" height="8" rx="2" fill="rgba(255,255,255,0.1)"/>
      <!-- Search button -->
      <rect x="340" y="8" width="48" height="28" rx="3" fill="rgba(200,240,78,0.2)"/>
    </g>

    <!-- Search results wireframe lines -->
    <g transform="translate(700, 148)" opacity="0.15">
      <rect x="0" y="0" width="380" height="72" rx="2" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="12" y="12" width="120" height="6" rx="1" fill="rgba(200,240,78,0.4)"/>
      <rect x="12" y="26" width="300" height="5" rx="1" fill="rgba(255,255,255,0.12)"/>
      <rect x="12" y="38" width="240" height="5" rx="1" fill="rgba(255,255,255,0.08)"/>
      <rect x="12" y="50" width="180" height="5" rx="1" fill="rgba(255,255,255,0.06)"/>
      <!-- #1 badge -->
      <rect x="344" y="8" width="28" height="18" rx="2" fill="#c8f04e" opacity="0.9"/>
    </g>
    <g transform="translate(700, 234)" opacity="0.09">
      <rect x="0" y="0" width="380" height="60" rx="2" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="12" y="12" width="90" height="5" rx="1" fill="rgba(255,255,255,0.2)"/>
      <rect x="12" y="24" width="280" height="4" rx="1" fill="rgba(255,255,255,0.08)"/>
      <rect x="12" y="36" width="200" height="4" rx="1" fill="rgba(255,255,255,0.06)"/>
    </g>
    <g transform="translate(700, 308)" opacity="0.06">
      <rect x="0" y="0" width="380" height="60" rx="2" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <rect x="12" y="12" width="80" height="5" rx="1" fill="rgba(255,255,255,0.15)"/>
      <rect x="12" y="24" width="260" height="4" rx="1" fill="rgba(255,255,255,0.06)"/>
    </g>

    <!-- Corner brackets -->
    <path d="M 40 40 L 40 90 M 40 40 L 90 40" fill="none" stroke="rgba(200,240,78,0.18)" stroke-width="1.5"/>

    <!-- Vertical divider -->
    <line x1="670" y1="60" x2="670" y2="690" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

    <!-- Bottom rule -->
    <line x1="80" y1="690" x2="600" y2="690" stroke="rgba(200,240,78,0.08)" stroke-width="1"/>
  </svg>

  <!-- Rank visual -->
  <div class="rank-visual">
    <div class="rank-row">
      <span class="rank-pos top">#1</span>
      <div class="rank-bar-wrap"><div class="rank-bar-fill top" style="width:95%"></div></div>
      <div class="rank-dot top"></div>
    </div>
    <div class="rank-row">
      <span class="rank-pos">#2</span>
      <div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:72%"></div></div>
      <div class="rank-dot"></div>
    </div>
    <div class="rank-row">
      <span class="rank-pos">#3</span>
      <div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:54%"></div></div>
      <div class="rank-dot"></div>
    </div>
    <div class="rank-row">
      <span class="rank-pos">#4</span>
      <div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:38%"></div></div>
      <div class="rank-dot"></div>
    </div>
    <div class="rank-row">
      <span class="rank-pos">#5</span>
      <div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:22%"></div></div>
      <div class="rank-dot"></div>
    </div>
  </div>

  <div class="editorial-num">05</div>

  <div class="logo">
    <div class="logo-wordmark">QUANTUN<em>.</em></div>
    <div class="logo-sub">Digital Agency</div>
  </div>

  <div class="content">
    <div class="category">
      <span class="cat-pill">SEO</span>
      <div class="cat-sep"></div>
      <span class="cat-secondary">Posicionamiento</span>
    </div>
    <h1 class="title">SEO</h1>
    <div class="title-sub">en la era de la <span>IA</span></div>
    <div class="desc-row">
      <div class="desc-bar"></div>
      <p class="desc">Nuevas reglas del juego para aparecer primero cuando la inteligencia artificial redefine cómo buscamos.</p>
    </div>
  </div>

</div>
</body>
</html>
