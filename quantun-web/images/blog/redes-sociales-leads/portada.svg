<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e0c"/>
      <stop offset="100%" stop-color="#181814"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Gráfico de embudo / flujo -->
  <g transform="translate(820, 160)" stroke="#c8f04e" fill="none">
    <!-- Embudo de conversión -->
    <rect x="20" y="0" width="300" height="52" rx="8" fill="#c8f04e" fill-opacity="0.18" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="170" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#c8f04e" fill-opacity="0.8" text-anchor="middle">DESCUBRIMIENTO</text>

    <line x1="170" y1="52" x2="170" y2="80" stroke-width="1.5" stroke-opacity="0.4"/>
    <polygon points="160,80 180,80 170,96" fill="#c8f04e" fill-opacity="0.4" stroke="none"/>

    <rect x="40" y="96" width="260" height="52" rx="8" fill="#c8f04e" fill-opacity="0.14" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="170" y="128" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#c8f04e" fill-opacity="0.7" text-anchor="middle">CONSIDERACIÓN</text>

    <line x1="170" y1="148" x2="170" y2="176" stroke-width="1.5" stroke-opacity="0.4"/>
    <polygon points="160,176 180,176 170,192" fill="#c8f04e" fill-opacity="0.4" stroke="none"/>

    <rect x="60" y="192" width="220" height="52" rx="8" fill="#c8f04e" fill-opacity="0.10" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="170" y="224" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#c8f04e" fill-opacity="0.6" text-anchor="middle">INTENCIÓN</text>

    <line x1="170" y1="244" x2="170" y2="272" stroke-width="1.5" stroke-opacity="0.4"/>
    <polygon points="160,272 180,272 170,288" fill="#c8f04e" fill-opacity="0.4" stroke="none"/>

    <rect x="90" y="288" width="160" height="52" rx="8" fill="#c8f04e" fill-opacity="0.35" stroke-width="2" stroke-opacity="0.9"/>
    <text x="170" y="320" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#c8f04e" text-anchor="middle">CONVERSIÓN</text>
  </g>

  <!-- Brackets -->
  <path d="M60,60 L60,40 L80,40" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M1140,60 L1140,40 L1120,40" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M60,690 L60,710 L80,710" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M1140,690 L1140,710 L1120,710" fill="none" stroke="#c8f04e" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Categoría -->
  <rect x="80" y="220" width="190" height="34" rx="17" fill="#c8f04e" fill-opacity="0.15" stroke="#c8f04e" stroke-width="1" stroke-opacity="0.5"/>
  <text x="175" y="242" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#c8f04e" text-anchor="middle" letter-spacing="1.5">MARKETING DIGITAL</text>

  <!-- Título -->
  <text x="80" y="318" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-2">Redes sociales</text>
  <text x="80" y="386" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-2">para captar</text>
  <text x="80" y="454" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#c8f04e" letter-spacing="-2">prospectos</text>

  <rect x="80" y="478" width="60" height="3" rx="2" fill="#c8f04e"/>
  <text x="80" y="530" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.4">Albert Anaya · 8 min de lectura · Jun 2026</text>
  <text x="1120" y="710" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" fill-opacity="0.5" text-anchor="end" letter-spacing="1">QUANTUN<tspan fill="#c8f04e">.</tspan></text>
</svg>
