<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>QUANTUN Digital · Design System</title>
  <meta name="description" content="Sistema de diseño QUANTUN Digital — CRM claro, cálido y minimalista. Tokens, componentes y pantallas." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%23C6F24E'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-family='Inter,sans-serif' font-size='64' font-weight='700' fill='%230E0E0C'%3EQ%3C/text%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="ds-tokens.css" />
  <link rel="stylesheet" href="site.css" />
  <style>
    /* Density tweak overlay */
    body[data-density="medium"] { --q-fs-base: 13.5px; }
    body[data-density="medium"] .q-btn { height: 34px; }
    body[data-density="medium"] .q-input, body[data-density="medium"] .q-select { height: 34px; }
    body[data-density="medium"] .q-table tbody td { padding: 14px 12px; }

    body[data-density="comfy"] { --q-fs-base: 14px; }
    body[data-density="comfy"] .q-btn { height: 36px; padding: 0 16px; }
    body[data-density="comfy"] .q-input, body[data-density="comfy"] .q-select { height: 36px; }
    body[data-density="comfy"] .q-table tbody td { padding: 16px 14px; }
    body[data-density="comfy"] .q-side-item { padding: 9px 10px; }

    /* Radius tweak overlay */
    body[data-radius="soft"]  { --q-r-xs: 4px; --q-r-sm: 6px; --q-r-md: 7px; --q-r-lg: 8px; --q-r-xl: 12px; }
    body[data-radius="round"] { --q-r-xs: 6px; --q-r-sm: 8px; --q-r-md: 10px; --q-r-lg: 12px; --q-r-xl: 16px; }

    /* KPI mode */
    body[data-kpi="ink"] .q-kpi-grid > :first-child { background: var(--q-ink); color: var(--q-bg); border-color: var(--q-ink); }
    body[data-kpi="ink"] .q-kpi-grid > :first-child * { color: inherit !important; }
    body[data-kpi="accent"] .q-kpi-grid > :first-child { background: var(--q-lima-soft); border-color: var(--q-lima); }

    /* Font swaps */
    body[data-font="manrope"] { --q-font-sans: 'Manrope', system-ui, sans-serif; }
    body[data-font="jakarta"] { --q-font-sans: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body[data-font="geist"]   { --q-font-sans: 'Geist', system-ui, sans-serif; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#FAFAF7"/>
      <rect x="30" y="30" width="40" height="40" rx="6" fill="#C6F24E"/>
      <text x="50" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#0E0E0C" letter-spacing="-1">Q</text>
    </svg>
  </template>

  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script src="logo-data.js"></script>
  <script type="text/babel" src="ds-icons.jsx"></script>
  <script type="text/babel" src="ds-components.jsx"></script>
  <script type="text/babel" src="screens-v2.jsx"></script>
  <script type="text/babel" src="site-shell.jsx"></script>
  <script type="text/babel" src="site-pages.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#C6F24E",
      "density": "compact",
      "radius": "sharp",
      "font": "inter",
      "kpiMode": "neutral"
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      React.useEffect(() => {
        document.body.dataset.density = t.density;
        document.body.dataset.radius  = t.radius;
        document.body.dataset.font    = t.font;
        document.body.dataset.kpi     = t.kpiMode;
        document.documentElement.style.setProperty('--q-lima', t.accent);
        const soft = mix(t.accent, '#ffffff', 0.78);
        const deep = mix(t.accent, '#000000', 0.38);
        document.documentElement.style.setProperty('--q-lima-soft', soft);
        document.documentElement.style.setProperty('--q-lima-deep', deep);
      }, [t.density, t.radius, t.font, t.kpiMode, t.accent]);

      // Build TOC from sections currently in the page
      const tocItems = [
        { id:'intro',         label:'Bienvenida' },
        { id:'principles',    label:'Principios' },
        { id:'logo',          label:'Logo' },
        { id:'color',         label:'Color' },
        { id:'type',          label:'Tipografía' },
        { id:'spacing',       label:'Espaciado · Radius' },
        { id:'buttons',       label:'Botones' },
        { id:'forms',         label:'Formularios' },
        { id:'badges',        label:'Badges & avatares' },
        { id:'cards',         label:'Cards & KPIs' },
        { id:'table',         label:'Tablas' },
        { id:'nav',           label:'Navegación & modales' },
        { id:'screen-dashboard', label:'Dashboard' },
        { id:'screen-servicios', label:'Servicios' },
        { id:'screen-clientes',  label:'Clientes' },
        { id:'changelog',     label:'Changelog' },
        { id:'handoff',       label:'Handoff' },
      ];

      const [tweaksOpen, setTweaksOpen] = React.useState(false);

      return (
        <>
          <div className="site">
            <SiteTopbar onToggleTweaks={() => setTweaksOpen(o => !o)}/>
            <SiteSidebar/>
            <main className="site-main">
              <HeroIntro/>
              <div className="page">
                <PrinciplesPage/>
                <LogoPage/>
                <ColorPage/>
                <TypePage/>
                <SpacingPage/>
                <ButtonsPage/>
                <FormsPage/>
                <BadgesPage/>
                <CardsPage/>
                <TablePage/>
                <NavModalPage/>
                <ScreensPage/>
                <ChangelogPage/>
                <HandoffPage/>
              </div>
              <footer style={{
                padding: '32px 56px', borderTop: '1px solid var(--q-border-subtle)',
                display:'flex', justifyContent:'space-between', alignItems:'center',
                color: 'var(--q-ink-4)', fontSize: 12,
              }}>
                <div style={{ display:'flex', alignItems:'center', gap: 10 }}>
                  <img src="assets/quantun-logo-negro.png" alt="" style={{ height: 16 }}/>
                  <span>Design System v 1.0</span>
                  <span>·</span>
                  <span>Mayo 2026</span>
                </div>
                <div style={{ display:'flex', gap: 14 }}>
                  <a href="#intro" style={{ color:'inherit' }}>Volver al inicio ↑</a>
                </div>
              </footer>
            </main>
            <SiteToc items={tocItems}/>
          </div>

          {tweaksOpen ? (
            <TweaksPanel title="Tweaks · DS">
              <TweakSection label="Color" />
              <TweakColor label="Acento de marca"
                value={t.accent}
                options={['#C6F24E','#D9F26A','#10B981','#16A34A','#2D8F5A','#0EA5E9','#0E0E0C']}
                onChange={(v) => setTweak('accent', v)}/>

              <TweakSection label="Tipografía" />
              <TweakSelect label="Familia" value={t.font}
                options={[
                  {value:'inter',  label:'Inter (default)'},
                  {value:'manrope',label:'Manrope'},
                  {value:'jakarta',label:'Plus Jakarta Sans'},
                  {value:'geist',  label:'Geist'},
                ]}
                onChange={(v)=> setTweak('font', v)}/>

              <TweakSection label="Sistema" />
              <TweakRadio label="Densidad" value={t.density}
                options={[
                  {value:'compact', label:'Compact'},
                  {value:'medium',  label:'Medio'},
                  {value:'comfy',   label:'Espacioso'},
                ]}
                onChange={(v)=> setTweak('density', v)}/>
              <TweakRadio label="Border-radius" value={t.radius}
                options={[
                  {value:'sharp', label:'Afilado'},
                  {value:'soft',  label:'Suave'},
                  {value:'round', label:'Redondo'},
                ]}
                onChange={(v)=> setTweak('radius', v)}/>

              <TweakSection label="KPI cards" />
              <TweakRadio label="Primera KPI" value={t.kpiMode}
                options={[
                  {value:'neutral',label:'Neutral'},
                  {value:'accent', label:'Acento'},
                  {value:'ink',    label:'Ink'},
                ]}
                onChange={(v)=> setTweak('kpiMode', v)}/>
            </TweaksPanel>
          ) : null}
        </>
      );
    }

    function mix(a, b, t) {
      const pa = parse(a), pb = parse(b);
      const r = Math.round(pa[0]*(1-t) + pb[0]*t);
      const g = Math.round(pa[1]*(1-t) + pb[1]*t);
      const bl= Math.round(pa[2]*(1-t) + pb[2]*t);
      return '#' + [r,g,bl].map(n => n.toString(16).padStart(2,'0')).join('');
    }
    function parse(h) {
      h = h.replace('#','');
      if (h.length===3) h = h.split('').map(c=>c+c).join('');
      return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
